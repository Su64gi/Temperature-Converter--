<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-image: url('bg.jpg'); /* Replace with your image path */
      background-size: cover; /* Ensures the image covers the entire background */
       background-repeat: no-repeat; /* Prevents the image from repeating */
      background-position: center;
      color: black;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: rgba(255, 255, 255, 0.26);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
      margin-top: 100px;
      
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      
    }
     select, button {
      width: 90%;
      padding: 12px;
      margin: 11px 0;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
    }
    input{
        width: 85%;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 1rem;

    }
    button {
      background: #0099ff;
      color: #fff;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background: #005bb5;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 5px;
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Temperature Converter</h1>
    <input id="temperatureInput" type="text" placeholder="Enter temperature" />
    <select id="unitSelect">
      <option value="C">Celsius</option>
      <option value="F">Fahrenheit</option>
      <option value="K">Kelvin</option>
    </select>
    <button id="convertButton">Convert</button>
    <div id="result" class="result"></div>
  </div>

  <script>
    const inputElement = document.getElementById('temperatureInput');
    const unitElement = document.getElementById('unitSelect');
    const convertButton = document.getElementById('convertButton');
    const resultElement = document.getElementById('result');

    function convertTemperature() {
      const input = inputElement.value.trim();
      const unit = unitElement.value;

      if (isNaN(input) || input === '') {
        resultElement.textContent = '⚠️ Please enter a valid number.';
        return;
      }

      const temperature = parseFloat(input);
      let result = '';

      if (unit === 'C') {
        const toFahrenheit = (temperature * 9) / 5 + 32;
        const toKelvin = temperature + 273.15;
        result = `Fahrenheit: ${toFahrenheit.toFixed(2)} °F, Kelvin: ${toKelvin.toFixed(2)} K`;
      } else if (unit === 'F') {
        const toCelsius = ((temperature - 32) * 5) / 9;
        const toKelvin = toCelsius + 273.15;
        result = `Celsius: ${toCelsius.toFixed(2)} °C, Kelvin: ${toKelvin.toFixed(2)} K`;
      } else if (unit === 'K') {
        const toCelsius = temperature - 273.15;
        const toFahrenheit = (toCelsius * 9) / 5 + 32;
        result = `Celsius: ${toCelsius.toFixed(2)} °C, Fahrenheit: ${toFahrenheit.toFixed(2)} °F`;
      } else {
        result = 'Invalid unit selected.';
      }

      resultElement.textContent = `Converted To: ${result}`;
    }

    convertButton.addEventListener('click', convertTemperature);
  </script>
</body>
</html>
